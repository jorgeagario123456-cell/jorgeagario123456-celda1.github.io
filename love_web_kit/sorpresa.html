<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorpresa 💘</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background: radial-gradient(100% 100% at 50% 30%, #1a1026, #0a0712 60%);
    color:#ffd1dc;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Color Emoji", "Apple Color Emoji", sans-serif;
    overflow:hidden;
  }
  canvas{position:fixed; inset:0; width:100%; height:100%}
  .title{
    position:fixed; top:18px; width:100%; text-align:center;
    font-size:clamp(26px, 6vw, 56px); letter-spacing:2px; text-shadow:0 0 12px rgba(255,77,109,.6);
    pointer-events:none;
  }
  .tip{
    position:fixed; bottom:14px; width:100%; text-align:center; font-size:14px; opacity:.8
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="title">feliz cumple valen</div>
<div class="tip">Toca para hacer estallar el corazón ✨</div>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const DPR = Math.max(1, devicePixelRatio || 1);
  let W=0,H=0;
  function resize(){
    W = canvas.width = innerWidth * DPR;
    H = canvas.height = innerHeight * DPR;
  } resize(); addEventListener('resize', resize);

  // Genera puntos objetivo con la ecuación paramétrica del corazón
  function heartPoints(n, scale){
    const pts = [];
    for(let i=0;i<n;i++){
      const t = Math.random()*Math.PI*2;
      // ecuación clásica del corazón (cartesiana paramétrica)
      const x = 16 * Math.pow(Math.sin(t),3);
      const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
      pts.push({x: x*scale, y: -y*scale});
    }
    return pts;
  }

  const palette = ['#ff4d6d','#ff7597','#ffd1dc','#ff99ac','#ffe6f0','#ffc2d1'];
  const particles = [];
  const center = ()=>({x:W/2, y:H/2});

  function resetParticles(explode=false){
    particles.length = 0;
    const scale = Math.min(W,H)/50;
    const targets = heartPoints(900, scale);
    const c = center();
    for(const t of targets){
      const start = explode
        ? {x:c.x, y:c.y, vx:(Math.random()*2-1)*6, vy:(Math.random()*2-1)*6}
        : {x:Math.random()*W, y:Math.random()*H, vx:0, vy:0};
      particles.push({
        x:start.x, y:start.y, vx:start.vx, vy:start.vy,
        tx:c.x + t.x, ty:c.y + t.y,
        color: palette[Math.floor(Math.random()*palette.length)],
        r: Math.random()*1.8 + 0.6
      });
    }
  }
  resetParticles(false);

  let last = performance.now();
  function tick(now){
    const dt = Math.min(40, now-last)/1000; last = now;
    ctx.clearRect(0,0,W,H);

    for(const p of particles){
      // atracción hacia el punto objetivo
      const ax = (p.tx - p.x) * 0.9;
      const ay = (p.ty - p.y) * 0.9;
      p.vx = (p.vx + ax*dt) * 0.85;
      p.vy = (p.vy + ay*dt) * 0.85;
      p.x += p.vx * dt * 30;
      p.y += p.vy * dt * 30;

      ctx.globalAlpha = 0.9;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  addEventListener('pointerdown', ()=>{
    resetParticles(true);
  });
</script>
</body>
</html>
