<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Te amo — Corazones animados</title>
<style>
  :root{
    --bg1:#140d1f;
    --bg2:#220a2a;
    --pink:#ff4d6d;
    --text:#ffd1dc;
    --star:#ffffff;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Color Emoji", "Apple Color Emoji", sans-serif;
    background: radial-gradient(60% 60% at 50% 30%, #28133b, var(--bg1)) fixed;
    color: var(--text);
    overflow:hidden;
  }

  .sky{
    position:fixed; inset:0; pointer-events:none; z-index:0;
  }

  .wrap{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100%;
    gap:14px;
    z-index:1;
  }

  h1{
    font-size: clamp(28px, 6vw, 60px);
    margin:0;
    letter-spacing:2px;
    text-shadow:0 0 10px rgba(255,77,109,.5);
  }

  .stage{
    width:min(92vmin, 640px);
    aspect-ratio:1/1;
    border-radius:20px;
    background: radial-gradient(100% 100% at 50% 50%, #180c26, #0b0813);
    box-shadow: inset 0 0 80px rgba(255,77,109,.08), 0 0 40px rgba(0,0,0,.35);
    position:relative;
    overflow:hidden;
  }
  svg{width:100%;height:100%;display:block}

  /* pequeño personaje en la esquina */
  .panda{
    position:absolute; left:12px; bottom:12px;
    font-size: clamp(22px, 5vmin, 36px);
    filter: drop-shadow(0 2px 2px rgba(0,0,0,.4));
    opacity:.9;
  }

  .hint{
    font-size:14px; opacity:.7; margin-top:4px;
  }
</style>
</head>
<body>
<canvas class="sky" id="sky"></canvas>

<div class="wrap">
  <h1>Te amo</h1>
  <div class="stage">
    <!-- SVG con la ruta del corazón -->
    <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
      <!-- estrellas fugaces decorativas (ligeras) -->
      <defs>
        <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
          <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
      </defs>

      <g id="hearts"></g>

      <!-- Ruta del corazón (invisible) -->
      <path id="heartPath"
            d="M50 30
               C 34 8, 2 34, 50 80
               C 98 34, 66 8, 50 30 Z"
            fill="none" stroke="rgba(255,77,109,.15)" stroke-width="0.6"/>
    </svg>

    <div class="bear">🤍🐻</div>
  </div>
  <div class="hint">Toca en cualquier parte para añadir más corazones ✨</div>
</div>

<script>
// Fondo estrellado muy ligero
(function stars(){
  const c=document.getElementById('sky');
  const ctx=c.getContext('2d');
  function resize(){ c.width=innerWidth; c.height=innerHeight;}
  resize(); addEventListener('resize', resize);
  const N = Math.min(200, Math.round((innerWidth*innerHeight)/9000));
  const s = Array.from({length:N}, ()=> ({
    x: Math.random()*c.width,
    y: Math.random()*c.height,
    r: Math.random()*1.3+0.3,
    a: Math.random()*Math.PI*2,
    sp: Math.random()*0.6+0.2
  }));
  function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    for(const p of s){
      p.a += 0.015;
      const tw = 0.6 + Math.sin(p.a)*0.4;
      ctx.globalAlpha = 0.3 + tw*0.7;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

// Corazones que recorren la ruta del corazón
(function heartRunner(){
  const svg = document.querySelector('svg');
  const path = document.getElementById('heartPath');
  const group = document.getElementById('hearts');
  const totalLength = path.getTotalLength();

  const palette = ['#ff4d6d','#ff7597','#ffd1dc','#ff99ac','#ff577f'];

  const HEARTS = 120;
  const SPEED = 22; // unidades/svg por segundo
  const hearts = [];

  function createHeart(offset){
    const t = document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('text-anchor','middle');
    t.setAttribute('dominant-baseline','middle');
    t.setAttribute('font-size','4');
    t.setAttribute('style','filter: drop-shadow(0 0 1px rgba(255,255,255,.5))');
    t.textContent = '❤';
    t.setAttribute('fill', palette[Math.floor(Math.random()*palette.length)]);
    group.appendChild(t);
    return {el:t, offset};
  }

  for(let i=0;i<HEARTS;i++){
    const off = (i/HEARTS)*totalLength;
    hearts.push(createHeart(off));
  }

  let last = performance.now();
  function animate(now){
    const dt = (now - last)/1000; last = now;
    for(const h of hearts){
      h.offset = (h.offset + SPEED*dt) % totalLength;
      const p = path.getPointAtLength(h.offset);
      const p2 = path.getPointAtLength((h.offset + 0.1) % totalLength);
      const angle = Math.atan2(p2.y-p.y, p2.x-p.x)*180/Math.PI;
      h.el.setAttribute('transform', `translate(${p.x},${p.y}) rotate(${angle})`);
    }
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);

  // Agregar mas corazones con toque/clic
  svg.addEventListener('pointerdown', (e)=>{
    for(let k=0;k<15;k++){
      const off = Math.random()*totalLength;
      const h = createHeart(off);
      hearts.push(h);
    }
  });
})();
</script>
</body>
</html>
